l_english:
 #Migration Wars
 game_concept_migration_war: "Migration War"
 game_concept_migration_wars: "Migration Wars"
 game_concept_migration_war_desc: "A Migration War is a powerful group of [casus_belli|E] that allows a member of the #V $BP_migration_situation_participant_group_migrators$#! of the #V $situation_BP_migration_situation$#! Situation to move their peoples into new lands, displacing the current residents.\n\nThe $game_concept_migration_war$ has two variants: $game_concept_major_migration_war$ and $game_concept_minor_migration_war$."
 general_migration_war_effects: "#bold Victory Effects:#!\n$EFFECT_LIST_BULLET$ Seizes all titles in target\n$EFFECT_LIST_BULLET$ Potentially convert low-development counties to your [culture|E] and [faith|E]\n$EFFECT_LIST_BULLET$ Temporarily improves [promote_culture|E] and [convert_county|E] tasks, even if the ruler's faith is unreformed."
 game_concept_major_migration_war: "Major Migration War"
 game_concept_major_migration_war_desc: "A Major Migration War represents a large scale movement of tribal peoples into lands owned by more advanced governments, such as the migration of the Vandals from Germany to Africa. This [casus_belli|E] provides additional levies upon war declaration.\n\n#bold Target:#! Adjacent [kingdom|E].\n\n$general_migration_war_effects$\n$EFFECT_LIST_BULLET$Events may fire allowing for cultural and governmental changes at the end of the war."
 game_concept_minor_migration_war: "Minor Migration War"
 game_concept_minor_migration_war_desc: "A Minor Migration War represents smaller movement of people, targeting an adjacent duchy.\n\n$general_migration_war_effects$\n$EFFECT_LIST_BULLET$Events may fire allowing for governmental changes at the end of the war."
 #Decisions
 game_concept_bp_cultural_law: "Cultural Law"
 game_concept_bp_cultural_law_desc: "#V Cultural Laws#! refer to various legal codices, such as the [Glossary('#italic Lex Visigothorum#!','Lex_Visigothorum')] and the [Glossary('#italic Lex Burgundionum#!','Lex_Burgundionum')] that were passed by the various Germanic post-Roman Successor States in light of the collapse of Roman rule in the Western half of the Empire. This particular decision, able to be take once per culture, allows the player to determine how to change (or if they want to change) their relations with the subject Roman population, with various benefits for the player and their dynasty."
 Lex_Visigothorum: "The #italic Lex Visigothorum#! ('Law of the Visigoths' or 'Visigothic Code', or more formally called the #italic Liber Iudiciorum#! or 'Book of Judgements') is a set of laws passed by the Visigothic Kingdom unifying the legal system in the Visigothic Kingdom, removing the division between Roman and Goth in Visigothic law, fusing both Roman Law and Germanic Law."
 Lex_Burgundionum: "The #italic Lex Burgundionum#! ('Law of the Burgundians' or 'Burgundian Code'), as well as the #italic Lex Romana Burgundionum#! ('Roman Law of the Burgundians') are the legal codes issued by the Burgundians covering both the laws covering the Roman and Burgundian populations, issued in the Late Vth Century in Burgundia."