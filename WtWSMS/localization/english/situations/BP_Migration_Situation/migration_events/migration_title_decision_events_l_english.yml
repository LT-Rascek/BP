l_english:
 #Generic Kingdom Formation
 migration_title_decision_events.0001.t: "The [the_kingdom_former.GetCulture.GetCollectiveNounNoTooltip] United!"
 migration_title_decision_events.0001.desc: "After decades of divisions and infighting, [the_kingdom_former.GetTitledFirstName] has proclaimed an united [the_kingdom_former.GetCulture.GetNameNoTooltip] kingdom, heralding a new political system amongst the formerly divided [the_kingdom_former.GetCulture.GetNameNoTooltip] people. With this union under a mighty ruler, the [the_kingdom_former.GetCulture.GetCollectiveNoun] pose a formidable military threat to their direct neighbors, and their aim seems to be to continue on the path of conquest."
 migration_title_decision_events.0001.the_king: "As it should be!"
 migration_title_decision_events.0002.t: "$migration_title_decision_events.0001.t$"
 migration_title_decision_events.0002.desc: "$migration_title_decision_events.0001.desc$"
 migration_title_decision_events.0002.good: "Good!"
 migration_title_decision_events.0002.neutral: "Interesting..."
 migration_title_decision_events.0002.bad: "Troubling..."