l_english:
 migration_general_events.0001.t: "The Migration Period"
 migration_general_events.0001.desc: "From the division of the Roman Empire in AD 395 to the Crowning of Charlemagne in AD 800, the demography, political topography, and religious landscape had change significantly. Groups of Germanics and Slavs overran the Western Empire, while the Arabs, united under the Rashiduns and Umayyads, overran much of the Eastern Empire.\n\nChristianity underwent numerous divisions, focused on the nature of Christ, attempting to parse the ineffable, while regions that once spoke Latin diverged from the mother tongue, while large parts that spoke Germanic languages instead adopt Slavic tongues.\n\nBut, these outcomes were far from predestined..."
 migration_general_events.0001.a: "Come, let us seize our destiny!"
 
 migration_general_events.0002.t: "The Migration Period Ends"
 migration_general_events.0002.desc: "After nearly 400 years, the map of world has changed greatly; great nations have risen and fallen, new faiths have spread to the four corners of the world.\n\nYet even now, there remain the echoes of the old order; now the wandering of peoples has come to an end, for now..."
 migration_general_events.0002.a: "The old order has fallen away, a new one has come..."