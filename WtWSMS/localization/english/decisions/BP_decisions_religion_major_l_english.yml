l_english:
 ##### ZOROASTRIAN DECISIONS #####
 legalize_caucasian_christianity: "Legalize Caucasian Christianity"
 legalize_caucasian_christianity_desc: "It is time to admit the attempts to convert the peoples of the Caucuses to the ways of Ahura Mazda have failed and grant them legal protections. In so doing, we may reduce the strife in this strategically vital region of the empire."
 legalize_caucasian_christianity_confirm: "So be it..."
 legalize_caucasian_christianity_tooltip: "Legalize Christianity at the cost of piety and clerical opinion"
 EVERY_CHRISTIAN_COUNTY_HELD_BY_ZOROASTRIANS_IS_RELIEVED: "Every [county|E] with the $armenian_rite_adj$, $georgian_orthodox_adj$, or $albanian_apostolic_adj$ [faith|E] and a $zoroastrianism_religion_adj$ ruler gains a #P +10#! popular opinion modifier for #V 50 years#!"
 EVERY_CHRISTIAN_IN_THE_COUNTRY_IS_RELIEVED: "Every [character|E] in the empire who is $armenian_rite_adherent$, $georgian_orthodox_adherent$, or $albanian_apostolic_adherent$ gets the following opinion of you:\n\t$EFFECT_LIST_BULLET$ gains #P 30#! [opinion|E] of your for #V 50 years#! #weak ($legalized_my_faith$)#!"
 EVERY_COURT_CHAPLAIN_IS_ANGRY: "All [court_chaplains|E] in the empire of faiths with [GetFaithDoctrine('doctrine_major_branch_behdin').GetBaseName] [doctrine|E] gain the following opinion:\n\t$EFFECT_LIST_BULLET$ loses #N 20#! [opinion|E] of you #weak (+1.20/year) (Angry)#!"
 