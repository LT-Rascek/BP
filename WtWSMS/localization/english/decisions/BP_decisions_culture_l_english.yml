 create_ostrogothic_culture_decision_title: "Create Ostrogothic Culture"
 create_ostrogothic_culture_decision_desc: "Over the last century, the united Gothic culture has repeatedly fractured. As the last bastion of the Gothic people, we can form a new ruling Eastern Gothic culture like our Visigothic bretheren, well suited to rule the decaying remnants of the Roman Empire."
 create_ostrogothic_culture_decision_tooltip: "Changes the culture of you and your courtiers to Ostrogothic"
 create_ostrogothic_culture_decision_confirm: "Confirm"
 
 adopt_bolghar_identity_decision: "Adopt Bolghar Identity"
 adopt_bolghar_identity_decision_desc: "The Oghuric peoples, long divided, are more alike than different. Now that I have become the strongest of all Oghurs, I can pull us together into a new unified identity, a new 'mixed' culture of [Glossary('#italic ğurs#!','GHUR_GLOSS')]:  the Bolghars!"
 adopt_bolghar_identity_decision_tooltip: "Shifts your culture name to Bolghar and brings various Bolghar cultures to your banner"
 adopt_bolghar_identity_decision_confirm: "Confirm"
 GHUR_GLOSS: "Oghuric Turkic for #italic tribes#!"