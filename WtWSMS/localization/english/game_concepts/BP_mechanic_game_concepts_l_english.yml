l_english:
 game_concept_razing_holding_math: "Odds of Razing Holdings during Migration"
 game_concept_razing_holding_math_desc: "The odds of razing a county is 20% without modification. The following factors influence the chance:\n\n$EFFECT_LIST_BULLET$Every [development|E] level of the county reduces the odds by 2%.\n$EFFECT_LIST_BULLET$The attacker's innovations further reduce the odds:\n$TAB$$EFFECT_LIST_BULLET$#weak $innovation_quilted_armor$, $innovation_primitive_leverage$, $innovation_mustering_grounds$, $innovation_castrae$, $innovation_tribal_warfare$ each reduce the odds by 1%#!\n$TAB$$EFFECT_LIST_BULLET$#weak $innovation_development_bp_00$, $innovation_barter$, $innovation_oppidum$ each reduce the odds by 2%#!\n$TAB$$EFFECT_LIST_BULLET$#weak $innovation_leges_barbarorum$, $innovation_social_stratification$, $innovation_writing$ each reduce the odds by 3%#!\n\nTherefore, if the county has a [development|E] level of #V 10#! or the attacker's culture has all non-regional #V $culture_era_tribal$#! [innovations|E], the razing of holdings will not occur."
 game_concept_culture_faith_flipping_math: "Odds of Flipping Culture and Faith during Migration"
 game_concept_culture_faith_flipping_math_desc: "The odds of changing a county's [culture|E] and [faith|E] during migration is 30% without modification.The following factors influence the chance:\n\n$EFFECT_LIST_BULLET$Every [development|E] level of the county reduces the odds by 2%\n$EFFECT_LIST_BULLET$Every era that the [county|E] [culture|E] is in beyond the #V $culture_era_tribal$#! Era reduces the odds by 5%.\n\nTherefore, if the county has a [development|E] level of #V 30#! the flip will not occur, and counties with advanced cultures will rarely flip."