l_english:
 tenet_eunuch_priests: "Eunuch Priesthood"
 tenet_eunuch_priests_desc: "Transforming themselves to be more like the consort of the Great Mother, eunuchs hold a special place in this faith."
 tenet_eunuch_priests_name: "Sacred Eunuchs"
 tenet_hero_cults_desc: "This religion features many myths relating to the mortal offspring of humans and gods. These stories of these individuals blur the boundary between the mundane and divine and serve to inspire the faithful."
 tenet_hero_cults_greek_desc: "$tenet_hero_cults_desc$"
 tenet_hero_cults_greek_name: "Latreía Íroa"
 tenet_hero_cults_latin_desc: "$tenet_hero_cults_desc$"
 tenet_hero_cults_latin_name: "Cultus Heroum"
 tenet_hero_cults_name: "Hero Cults"
 tenet_mystery_religion_desc: "This faith restricts participation in its rituals to those who have become initiates. This creates a sense of prestige and community that is otherwise rare in pagan faiths."
 tenet_mystery_religion_greek_desc: "$tenet_mystery_religion_desc$"
 tenet_mystery_religion_latin_desc: "$tenet_mystery_religion_desc$"
 tenet_mystery_religion_latin_name: "Cultus Mysterii"
 tenet_mystery_religion_latin_name: "Mystiriakés Latreía"
 tenet_mystery_religion_name: "Mystery Religion"
 tenet_philsophical_movement_desc: "This faith has been developed by great thinkers and philosophers, greatly raising the importance of erudition within its beliefs."
 tenet_philsophical_movement_greek_desc: "$tenet_philsophical_movement_desc$"
 tenet_philsophical_movement_greek_name: "Philosophía"
 tenet_philsophical_movement_latin_desc: "$tenet_philsophical_movement_desc$"
 tenet_philsophical_movement_latin_name: "Philosophia"
 tenet_philsophical_movement_name: "Philosophical Movement"
