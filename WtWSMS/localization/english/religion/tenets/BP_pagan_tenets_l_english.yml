 doctrine_parameter_tenet_mystery_religion_resistance: "Conversion Resistance: #P +[EmptyScope.ScriptValue('tenet_mystery_religion_resistance_value')|0%]#!
 doctrine_parameter_tenet_mystery_religion_same_rite_agent_acceptance: "Adherents are #EMP much#! more willing to become Agents in the [schemes|E] of other characters"
 doctrine_parameter_unlocks_automutiliation_decision: "Unlocks the #V $automutiliation_decision$#! [decision|E], if not [GetTrait('cynical').GetName( GetNullCharacter )]"
 doctrine_parameter_unlocks_prisoner_castration_if_callous_sadistic_arbitrary: "Unlocks the option to castrate prisoners, if you are [GetTrait('callous').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], or [GetTrait('arbitrary').GetName( GetNullCharacter )]"
