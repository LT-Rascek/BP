 iranian_pagan_desc: "$iranian_religion$\n\nIn the Eastern Iranian regions, it likely synthesized with the Vedic-derived Hindu faiths, including Shaivism and Suryaism, bring solar worship into the Iranian sphere, and thus was part of the substrate for the later Zunist faith."
 