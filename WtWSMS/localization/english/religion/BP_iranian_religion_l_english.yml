 iranian_religion_desc: "Indo-Iranian Paganism is the pre-Zoroastrian religion of the Indian and Iranian peoples. While Zoroastrianism supplanted much of these practices, they remained extant in Bactria and among tribal peoples on the outskirts of the Persian Empire."
 
