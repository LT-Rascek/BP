l_english:
 #Vegetarianism
 doctrine_ritual_vegetarianism_name: "View of Vegetarianism"
 doctrine_parameter_enables_vegetarianism: "Enables #V $become_a_vegetarian$#! minor [decision|E]"
 doctrine_parameter_clerics_are_vegetarians: "Clerics of this faith have the [GetTrait('vegetarian').GetName(GetNullCharacter)|L] trait"
 doctrine_parameter_cannot_hunt: "$culture_parameter_cannot_hunt$"
 doctrine_ritual_vegetarianism_required_name: "Required"
 doctrine_ritual_vegetarianism_required_desc: "This faith views vegetarianism as a goal for which all adherents should strive."
 doctrine_ritual_vegetarianism_clerics_name: "Clerical"
 doctrine_ritual_vegetarianism_clerics_desc: "This faith views vegetarianism as required for clerics and suggested for adherents."
 doctrine_ritual_vegetarianism_partial_name: "Moral"
 doctrine_ritual_vegetarianism_partial_desc: "This faith suggests a vegetarian diet, although not strictly required. Some pious adherents may abstain from meat to focus on the divine."
 doctrine_ritual_vegetarianism_no_statement_name: "Not Required"
 doctrine_ritual_vegetarianism_no_statement_desc: "This faith makes no suggestion concerning vegetarianism."
 doctrine_monist_name: "Monist"
 doctrine_monist_desc: "All of reality is derived from a single, unifying, universal principle which is ontologically antecedent to observed reality."
 doctrine_agnostic_name: "Agnostic"
 doctrine_agnostic_desc: "The existence or non-existence of the divine is irrelevant to the life of humanity."
 doctrine_roman_polytheist_name: "Polytheistic Syncretism"
 doctrine_roman_polytheist_desc: "The cosmos has many powerful deities and spirits under different names, reflecting a universal truth about the divine. But none can claim to have a singular understanding of the divine order."
 doctrine_parameter_hostility_override_doctrine_polytheist: "Considers [faiths|E] with the #V $doctrine_polytheist_name$#! Theism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_roman_polytheist: "Considers [faiths|E] with the #V $doctrine_roman_polytheist_name$#! Theism [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
