l_english:
 SPECIAL_DOCTRINE_IS_HELLENIC_FAITH_PLINY_QUOTE_LATIN: "#weak1 Fragilis et laboriosa mortalitas in partes ita digessit infirmitatis suae memor, ut portionibus coleret quisque quo maxime indigeret. itaque nomina alia aliis gentibus et numina in iisdem innumerabilia invenimus, inferis quoque in genera discriptis morbisque et multis etiam pestibus, dum esse placatas trepido metu cupimus. - Gaius Plinius Secundus, #italic Naturalis Historia#! II.V.XV#!"
 pliny_natural_history_quote: "[Glossary('$SPECIAL_DOCTRINE_IS_HELLENIC_FAITH_PLINY_QUOTE_LATIN|q$','special_doctrine_is_hellenic_faith_pliny_quote_english')]"
 special_doctrine_is_hellenic_faith: "Greco-Roman Polytheism"
 special_doctrine_is_hellenic_faith_desc: "The Greeks and the Romans had a tendency to identify foreign deities with their own gods. This provided a rich sediment for both to syncretize with the various peoples they conquered and integrate them into their own cultures.\nIn $wtwsms_italic$, we model this tendency by giving the Hellenic faith this doctrine, which greatly increases Hellenic tolerance of divergence.\n\n$pliny_natural_history_quote$"
 special_doctrine_is_hellenic_faith_desc_hellenic: "$special_doctrine_is_hellenic_faith_desc$"
 special_doctrine_is_hellenic_faith_desc_roman: "$special_doctrine_is_hellenic_faith_desc$"
 special_doctrine_is_hellenic_faith_name: "$special_doctrine_is_hellenic_faith$"
 special_doctrine_is_hellenic_faith_name_hellenic: "Ellinikí Ermineía"
 special_doctrine_is_hellenic_faith_name_roman: "Interpretatio Romana"
 special_doctrine_is_hellenic_faith_pliny_quote_english: "Mindful of its own frailty, fragile and toilsome mortality has divided the divine realm into various spheres, so that each person might worship the specific power of which he stood in greatest need. Thus, we find different names and countless deities among different peoples—with even the powers of the underworld, as well as diseases and many plagues, classified into distinct categories—all because, in trembling fear, we desire to keep them appeased. - Pliny the Elder, #italic Natural History 2.5.15#!"