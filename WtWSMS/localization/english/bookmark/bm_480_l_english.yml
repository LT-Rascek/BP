 bm_group_480: "Aftermath:\nAD 486"
 
 bm_486_frankish_steel: "Frankish Steel"
 bm_486_frankish_steel_desc: "With the conquest of the rump state of Soissons, the Franks, under Clovis, are masters of northern Gaul. Unlike the other post-Roman states, the Frankish government remains an unique blend of Roman Administrative governance and Frankish Traditional Law, while the Visigoths and Skirians have much more closely followed Roman mores and structures.\n\n#bold Will Francia have what it takes to subdue the Visigoths and Burgundians, or is Gaul destined to remain split between various potentates?#!"
 