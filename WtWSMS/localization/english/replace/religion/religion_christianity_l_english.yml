 conversos: "Nazarenes"
 conversos_adj: "Nazarene"
 conversos_adherent: "Nazarene"
 conversos_adherent_plural: "Nazarenes"
 conversos_desc: "The Nazarenes were an early Jewish Christian sect from the First to the Fifth Century. They continued to observe the Torah in contrast to proto-Orthodox and later Nicene Church. They were distinguished from other Jewish Christian sects like the Ebionites by Patristic polemics, such as the #italic Panarion#!.\n\nUnlike the Ebionites, the distinction of the Nazarenes beliefs from orthodoxy was less certain, except that they maintained Jewish customs against the norms of the wider Christian church."
 