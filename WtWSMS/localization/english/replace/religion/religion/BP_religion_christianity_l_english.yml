l_english:
 nestorian: "Trenkyanism"
 nestorian_adj: "Trenkyanite"
 nestorian_adherent: "Trenkyanite"
 nestorian_adherent_plural: "Trenkyanites"
 nestorian_desc: "At the Council of Ephesus, Nestorius' formulation of the nature of Christ was condemned. In the East, however, long separated from Rome, the Assyrians and Chaldeans reached a separate formula:  Lord Jesus Christ, the Word and Son of God, there exists one Parṣōpā, there are two natures (Trēn Kyānē) and two concrete instances  and realities (Trēn Qnōmē) of the two natures, in one person (Ḥdā Parṣōpā) in Christ. This formulation, while natural in Syriac, was found insufficient and later condemned.\n\nThe neologism 'Trenkeyaneism' helps avoid the partisan nature of the histographical term 'Nestorian', which never accurately reflected the views of the Church of the East; it is meant to be a close synonym to the Greek Term 'Dyophysite'."
 nestorian_religious_head_title: "Patriarch"
 nestorian_religious_head_title_name: "Patriarchate"
 
