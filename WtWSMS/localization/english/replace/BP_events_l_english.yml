l_english:
 culture_emergence_events.0001.desc: "I am [ROOT.Char.GetCulture.GetName], but the people of my capital, the [capital_county_scope.GetBaseName], are [hybdridization_offer_culture.GetName]. As of late, I have seen my [ROOT.Char.GetCulture.GetName] subjects emulating the local [capital_county_scope.GetAdjectiveNoTooltip] people and their [hybdridization_offer_culture.GetName] ways.\n\nWe are adopting their traditions nearly entirely, but in the process the local [hybdridization_offer_culture.GetName] are accepting my rule...\n\nPerhaps this development should be encouraged?"