l_english:
 BP_major_culture_decisions.0001.t: "Creation of Ostrogothic Culture"
 BP_major_culture_decisions.0001.others.desc: "The rulers of [culture_former.GetPrimaryTitle.GetName] has elected to form a new ruling culture, [GetCultureByKey('ostrogothic').GetName]. The creation of this new military and cultural elite has differentiated them from the [Glossary('#italic hoi polloi#!','HOI_POLLOI_GLOSS')], making them like the Visigoths and imbuing them with the tools necessary to rule over disparate peoples.\n\nOnly time will tell what these new Ostrogoths will do..."
 BP_major_culture_decisions.0001.other_goths.desc: "The rulers of [culture_former.GetPrimaryTitle.GetName] has elected to form a new ruling culture, [GetCultureByKey('ostrogothic').GetName]. The creation of this new military and cultural elite has differentiated them from the [Glossary('#italic hoi polloi#!','HOI_POLLOI_GLOSS')], making them like the Visigoths and imbuing them with the tools necessary to rule over disparate peoples. This has separated themselves from us, making us two different peoples..."
 BP_major_culture_decisions.0001.culture_former.desc: "Like our Visigothic brothers, it is time we embrace a new elite culture that better differentiates us from the [Glossary('#italic hoi polloi#!','HOI_POLLOI_GLOSS')], and sets us on the path to rule the remnants of the Roman Empire. May this new [GetCultureByKey('ostrogothic').GetName] culture let us seize our destiny!"
 BP_major_culture_decisions.0001.the_former: "It is time to seize our destiny!"
 BP_major_culture_decisions.0001.neutral: "I see..."
 
 BP_major_culture_decisions.0002.t: "Creation of Bolghar Identity"
 BP_major_culture_decisions.0002.others.desc: "The rulers of [culture_former.GetPrimaryTitle.GetName] have gathered enough other Oghuric Speakers to their banner to coalesce into a new identity, the mixed [Glossary('#italic ğurs#!','GHUR_GLOSS')], the #italic Bulgagurs#!, or #V Bolghars#!. Most of the Oghuric tribes have adopted the new name as their own.\n\n Today marks a new step in the history of the $true_bolghar_collective_noun$; time will tell what these new $true_bolghar_collective_noun$ will do..."
 BP_major_culture_decisions.0002.other_oghurs.desc: "The rulers of [culture_former.GetPrimaryTitle.GetName] have gathered enough other Oghuric speakers to their banner to coalesce into a new identity, the mixed [Glossary('#italic ğurs#!','GHUR_GLOSS')], the #italic Bulgagurs#!, or #V Bolghars#!. Most of the Oghuric tribes have adopted the new name as their own.\n\n Today marks a new step in the history of the $true_bolghar_collective_noun$; time will tell what these new $true_bolghar_collective_noun$ will do, but we stay true to the old ways!"
 BP_major_culture_decisions.0002.culture_former.desc: "I have finally gathered the scattered $heritage_oghuric_collective_name$ and marshalled them to my banner, creating a new identity, the mixed [Glossary('#italic ğurs#!','GHUR_GLOSS')], the #italic Bulgagurs#!, or #V Bolghars#! This is a new chapter in the history of our peoples, and I will seize our destiny!
 BP_major_culture_decisions.0002.the_former: "It is time to seize our destiny!"
 BP_major_culture_decisions.0002.neutral: "I see..."