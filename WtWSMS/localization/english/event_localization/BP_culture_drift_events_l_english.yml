l_english:
 #Heritage/Linguistic Drift
 ## Language Drift
 bp_heritage_linguistic_drift.0002.t: "Linguistic Drift"
 bp_heritage_linguistic_drift.0002.desc.latin: "Where once all peoples of the Western Mediterranean spoke a single Latin Language with regional dialects, the fracturing of the Western Empire into dozens, hundreds of states and statelets have effectively halted trade and exchange, sharpening regional differences.\n\nNow the tongue of the [drift_culture.GetName] people has changed enough from Latin that it can no longer truly be considered the tongue of Scipio and Caesar, but something subtly different."
 bp_heritage_linguistic_drift.0002.desc.old_romance: "As time has gone on and the memory of Rome fades, the Romance people have fractured, and the spoken language has evolved more. Now, the language of the [drift_culture.GetName] people has changed further, into a newer, more radical form, far less inteligible with the speech of Cicero than what they spoke centuries earlier."
 bp_heritage_linguistic_drift.0002.desc: "As time goes on and polities change and people move, languages begin to change. Regional variations build up, until the spoken language can no longer be called the same. This has occurred in the [drift_culture.GetName] culture, whose tongue has now deviated significantly from its old form."
 bp_heritage_linguistic_drift.0002.desc.minority: "\n\nThese changes have also been reflected among minorities living in [drift_culture.GetNameNoTooltip] lands, such as the [check_minority_culture.GetCollectiveNoun]."
 bp_heritage_linguistic_drift.0002.accept: "As times change, so must we"
 bp_heritage_linguistic_drift.0002.accept.tooltip: "Your [culture|E]'s [language|E] has changed to [drift_culture.GetLanguage.GetName|V]"
 bp_heritage_linguistic_drift.0003.t: "$bp_heritage_linguistic_drift.0002.t$"
 bp_heritage_linguistic_drift.0003.desc.latin: "$bp_heritage_linguistic_drift.0002.desc.latin$"
 bp_heritage_linguistic_drift.0003.desc.old_romance: "$bp_heritage_linguistic_drift.0002.desc.old_romance$"
 bp_heritage_linguistic_drift.0003.desc.minority: "$bp_heritage_linguistic_drift.0002.desc.minority$"
 bp_heritage_linguistic_drift.0003.desc: "$bp_heritage_linguistic_drift.0002.desc$"
 bp_heritage_linguistic_drift.0003.accept_same_culture: "$bp_heritage_linguistic_drift.0002.accept$"
 bp_heritage_linguistic_drift.0003.accept_same_culture.tooltip: "$bp_heritage_linguistic_drift.0002.accept.tooltip$"
 bp_heritage_linguistic_drift.0003.accept_different_culture: "I see"
 bp_heritage_linguistic_drift.0003.accept_different_culture.tooltip: "The [drift_culture.GetName] [culture|E]'s [language|E] has changed to [drift_culture.GetLanguage.GetName|V]"
 ## Language Tooltips
 ## Heritage Drift
 bp_heritage_linguistic_drift.0102.t: "Customary Drift"
 bp_heritage_linguistic_drift.0102.roman.desc: "Where once all peoples of the Western Mediterranean were united into a single polity with similar behaviours, the fracturing of the Western Roman Empire into dozens, hundreds of states and statelets have effectively halted trade and exchange, sharpening regional differences.\n\nNow the mannerisms and customs of even the [drift_culture.GetName] people has changed enough from the practices of the people who colonized and dominate the #italic Pars Occidentalis#! that Octavian himself would not recognize them."
 bp_heritage_linguistic_drift.0102.latin.desc: "Where once all peoples of the Western Mediterranean were united into a single polity with similar behaviours, the fracturing of the Western Empire into dozens, hundreds of states and statelets have effectively halted trade and exchange, sharpening regional differences.\n\nNow the mannerisms and customs of the [drift_culture.GetName] people have changed enough from Roman practices that they are foreign to those of Roman customs."
 bp_heritage_linguistic_drift.0102.desc: "As time goes on, customs begin to differ, until the point where they are no longer recognizable to ones ancestors. This has occurred for the [drift_culture.GetName] people, whose [drift_culture.GetHeritage.GetName] ways have clearly changed from the past."
 bp_heritage_linguistic_drift.0102.accept: "As times change, so must we"
 bp_heritage_linguistic_drift.0102.accept.tooltip: "Your [culture|E]'s [heritage|E] has changed to [drift_culture.GetHeritage.GetName|V]"
 bp_heritage_linguistic_drift.0103.t: "$bp_heritage_linguistic_drift.0102.t$"
 bp_heritage_linguistic_drift.0103.latin.desc: "$bp_heritage_linguistic_drift.0103.latin.desc$"
 bp_heritage_linguistic_drift.0103.desc: "$bp_heritage_linguistic_drift.0102.desc$"
