 #Heritage Drift - Choose Heritage
 bp_heritage_linguistic_drift.0104.t: "Rethinking our Heritage"
 bp_heritage_linguistic_drift.0104.carpodaci.desc: "The old Gothic confederations are fraying at the seams.\nWe were once a proud part of that tapestry, but it has become absorbed into a broadening sphere of #italic Germania#!. It is clear there is no place in this foreign custom for [ROOT.Char.GetCulture.GetCollectiveNoun].\n\nMy mind knows that Dacian sons still live, born under Roman names. The heritage they boast of is ours to claim.\n\nBut my heart differs. Would it betray our ancestors to accept the imperial custom we have so thoroughly resisted?"
 bp_heritage_linguistic_drift.0104.vlach: "We must reunite with our Wallachian kin."
 bp_heritage_linguistic_drift.0104.vlach.tt: "[ROOT.Char.GetCulture.GetName] becomes [GetCulturePillar('heritage_vlach').GetName|V] [heritage|E]"
 bp_heritage_linguistic_drift.0104.carpathian: "Dacians will always be free!"
 bp_heritage_linguistic_drift.0104.carpathian.tt: "[ROOT.Char.GetCulture.GetName] becomes [GetCulturePillar('heritage_albanian').GetName|V] [heritage|E]"
 