l_english:
 ##### Intro Event giving players information #####
 #Generic Event Formatting Stuff
 BP_maintenance_events.0001.section_spacer: "\n\n=================================================\n\n"
 BP_maintenance_events.0001.sub_section_spacer: "\n-----------------------------------------------------------------------\n"
 BP_maintenance_events.0001.subsection_spacer: "\n\n"
 #Intro Stuff
 BP_maintenance_events.0001.t: "Welcome to WtWSMS v$wtwsms_mod_version_number$"
 BP_maintenance_events.0001.desc.opening: "Welcome to the $wtwsms_game_status$ v$wtwsms_mod_version_number$ of \"When the World Stopped Making Sense\"!, or \"WtWSMS\" for short. WtWSMS is a Migration Era (period sometimes also referred to as the "Dark Ages") massive major overhaul mod for Crusader Kings III."
 BP_maintenance_events.0001.desc.more_information: "\n\nFor more information about the mod, visit:\n\t$EFFECT_LIST_BULLET$ Our $wtwsms_forum_location_type$ at $wtwsms_forum_location$\n\t$EFFECT_LIST_BULLET$ Our wiki page at $wtwsms_wiki_page$."
 BP_maintenance_events.0001.desc.development_info: "\n\nAs it is in development:\n\t$EFFECT_LIST_BULLET$ Save often in case of crashes\n\t$EFFECT_LIST_BULLET$If you find a bug, please tell us on the forum or on our Discord Server (link in the forum)"
 #New Features
 BP_maintenance_events.0001.new_features_intro: "#T Here's the major new features in v$wtwsms_mod_version_number$#!:\n\n"
 ## No DLC Features
 BP_maintenance_events.0001.new_features_list_no_dlc: "$EFFECT_LIST_BULLET$$event_new_feature_hegemonies$\n$EFFECT_LIST_BULLET$$event_new_feature_landed_titles$\n$EFFECT_LIST_BULLET$$event_new_feature_subroman_transition_overhaul$\n$EFFECT_LIST_BULLET$$event_new_feature_high_tribal_changes$\n$EFFECT_LIST_BULLET$$event_new_feature_dynasty_legacy$\n$EFFECT_LIST_BULLET$$event_new_feature_new_flags$"
 event_new_feature_hegemonies: "Hegemonies for the Roman Empires and Persian Empire have been added"
 event_new_feature_landed_titles: "Overhaul of landed titles in line with the new hegemonies"
 event_new_features_tribal_authority: "Both Tribal and High Tribal governments use Tribal Authority now"
 event_new_feature_subroman_transition_overhaul: "The Sub-Roman Transition events have been extensively overhaul to reduce the system's opacity, improve flexibility, and make it more responsive to the player"
 event_new_feature_high_tribal_changes: "High Tribal Government has its own transition system via an innovation-driven \"High Tribal Organization\" law that has High Tribal government more closely mold itself towards Feudal government"
 event_new_feature_dynasty_legacy: "Added a new Dynasty Legacy, \"$BP_roman_heritage_legacy_track_name$\", available for dynasts of Greco-Roman cultures."
 event_new_feature_new_flags: "Added new realm frames for Roman, Persian, and High Tribal governments"
 ## DLC Features
 BP_maintenance_events.0001.new_features_intro_dlc: "If you have #italic Roads to Power#!, then you additionally have:\n\n"
 BP_maintenance_events.0001.new_features_list_dlc: "$EFFECT_LIST_BULLET$$event_new_feature_roman_admin$\n$EFFECT_LIST_BULLET$$event_new_feature_federate_overhaul$"
 event_new_feature_roman_admin: "New administrative Roman governments, for both Roman and Sub-Roman Governments, along with a completely new council for Roman administrative hegemonies"
 event_new_feature_federate_overhaul: "New 'Roman Federate' government to more accurately model the federate system within the Roman bureaucratic government"
 BP_maintenance_events.0001.closing: "We hope you enjoy this mod, and let us know of any bugs on the forum or on the Discord!"
 #Response
 BP_maintenance_events.0001.a: "Got it, now let me play!"
 