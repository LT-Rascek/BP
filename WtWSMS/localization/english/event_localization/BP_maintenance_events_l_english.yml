l_english:
 ##### Intro Event giving players information #####
 #Generic Event Formatting Stuff
 BP_maintenance_events.0001.section_spacer: "\n\n=================================================\n\n"
 BP_maintenance_events.0001.sub_section_spacer: "\n-----------------------------------------------------------------------\n"
 BP_maintenance_events.0001.subsection_spacer: "\n\n"
 #Intro Stuff
 BP_maintenance_events.0001.t: "Welcome to WtWSMS v$wtwsms_mod_version_number$"
 BP_maintenance_events.0001.desc.opening: "Welcome to the $wtwsms_game_status$ v$wtwsms_mod_version_number$ of \"When the World Stopped Making Sense\"!, or \"WtWSMS\" for short. WtWSMS is a Migration Era (period sometimes also referred to as the "Dark Ages") massive major overhaul mod for Crusader Kings III."
 BP_maintenance_events.0001.desc.more_information: "\n\nFor more information about the mod, visit:\n\t$EFFECT_LIST_BULLET$ Our forum thread at [bp_forum_location|E]\n\t$EFFECT_LIST_BULLET$ Our wiki page at [bp_wiki_location|E]."
 BP_maintenance_events.0001.desc.development_info: "\n\nAs it is in development:\n\t$EFFECT_LIST_BULLET$ Save often in case of crashes\n\t$EFFECT_LIST_BULLET$If you find a bug, please tell us on the forum or on our Discord Server (link in the forum)"
 #New Features
 BP_maintenance_events.0001.new_features_intro: "#T Here's the major new features in v$wtwsms_mod_version_number$#!:\n\n"
 ## No DLC Features
 BP_maintenance_events.0001.new_features_list_no_dlc: "$EFFECT_LIST_BULLET$$event_new_feature_steppe_culture_overhaul$\n$EFFECT_LIST_BULLET$$event_new_feature_steppe_map_overhaul$\n$EFFECT_LIST_BULLET$$event_new_features_steppe_flavor$"
 event_new_feature_steppe_culture_overhaul: "Significant overhaul of Steppe cultures to better reflect notions of ethnic self-identification and heritages in the Late Antique Period."
 event_new_feature_steppe_map_overhaul: "Overhauled the de jure and de facto titles on map, including which polities are tributaries and which are vassals, to better reflect the situation in the Steppe and Central Asia during the Late Vth Century as well as to better integrate with the Vanilla Steppe mechanics."
 event_new_features_steppe_flavor: "Added a number of decisions and features to model the unique traditions of the Steppe, including an Artificial Cranial Deformation mechanic and Bolghar Unification Decision."
 ## DLC Features
 #BP_maintenance_events.0001.new_features_intro_dlc: "If you have #italic Roads to Power#!, then you additionally have:\n\n"
 BP_maintenance_events.0001.new_features_intro_dlc: ""
 BP_maintenance_events.0001.new_features_list_dlc: ""
 BP_maintenance_events.0001.closing: "We hope you enjoy this mod, and let us know of any bugs on the forum or on the Discord!"
 #Response
 BP_maintenance_events.0001.a: "Got it, now let me play!"
 