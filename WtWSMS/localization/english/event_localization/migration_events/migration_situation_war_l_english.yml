l_english:
 migration_situation_war.0100.t: "A New Administration?"
 migration_situation_war.0100.desc.opening: "Having overrun an advanced government, remnants of their administration remain in these new lands, which we can use to update how we govern this new land. "
 migration_situation_war.0100.desc.roman: "The Romans, who built an effective system of administration that has continued to the present, even in these trying times, offer a way forward. Alternatively, we could continue with a new, higher form of Tribal administration if we wanted. Or we could simply keep to the old ways..."
 migration_situation_war.0100.desc.fallback: "We could continue with a new, higher form of Tribal administration if we wanted. Or we could simply keep to the old ways..."
 migration_situation_war.0100.adopt_advanced_government: "It is time for us to leave the old ways..."
 migration_situation_war.0100.adopt_subroman_government: "Let us maintain these ancient institutions, with ourselves at the head!"
 migration_situation_war.0100.keep_current_government: "No! We will not abandon the old ways!"
 migration_war_picked_subroman: "$cultural_acceptance_gain_event$"