l_english:
 bp_change_culture_name_events.0002.t: "A Culture Changes Names"
 bp_change_culture_name_events.0002.desc: "As the influence of Parthians have continued to decline, there are no longer any significant Parthian landholders. As such, the Parthians have fallen under the influence of the Persians and have even begun to refer to themselves by a Persian term, Pahlavi."
 bp_change_culture_name_events.0002.ok: "As times goes on, things change"